  <g class="map-label-light">
    <text x="1132" y="370">1</text><text x="952" y="359">2</text><text x="1317" y="392">3</text><text x="1132" y="538">4</text>
  </g>
  <rect x="831" y="611" width="685" height="37" rx="18" fill="#172018" opacity="0.9"/>
  <text x="850" y="635" class="panel-copy">1 中央活动场　2 水景记忆点　3 林地捷径　4 南门缓冲区</text>

  <!-- Decision cards -->
  <text x="64" y="721" class="panel-title">请你先拍板 4 件事</text>
  <text x="64" y="750" class="panel-copy">直接回复“1A、2B、3A、4保留湖”即可；也可以在图上描述你想移动的区域。</text>

  <g transform="translate(48 776)">
    <rect width="360" height="174" rx="20" fill="#222D24" stroke="#39483A" stroke-width="2"/>
    <circle cx="32" cy="33" r="16" fill="#F0BD46"/><text x="27" y="39" class="chip">1</text>
    <text x="60" y="40" class="card-title">路线骨架</text>
    <text x="24" y="76" class="card-copy">A　环形主路（草案，推荐）</text>
    <text x="24" y="105" class="card-copy">B　保留十字轴，仅重排建筑</text>
    <text x="24" y="134" class="card-copy">C　更自由、更多岔路的探索型</text>
    <text x="24" y="158" class="metric-label">影响：迷路概率 / 路线重复感</text>
  </g>

  <g transform="translate(430 776)">
    <rect width="360" height="174" rx="20" fill="#222D24" stroke="#39483A" stroke-width="2"/>
    <circle cx="32" cy="33" r="16" fill="#61A1A5"/><text x="27" y="39" class="chip">2</text>
    <text x="60" y="40" class="card-title">探索难度</text>
    <text x="24" y="76" class="card-copy">A　轻松：主路一眼能懂</text>
    <text x="24" y="105" class="card-copy">B　适中：地标之间有小绕路</text>
    <text x="24" y="134" class="card-copy">C　挑战：建筑后方藏点更多</text>
    <text x="24" y="158" class="metric-label">建议展会短局选 B</text>
  </g>

  <g transform="translate(812 776)">
    <rect width="360" height="174" rx="20" fill="#222D24" stroke="#39483A" stroke-width="2"/>
    <circle cx="32" cy="33" r="16" fill="#D87943"/><text x="27" y="39" class="chip">3</text>
    <text x="60" y="40" class="card-title">视觉气质</text>
    <text x="24" y="76" class="card-copy">A　校园花园：湖、树、花坛为主</text>
    <text x="24" y="105" class="card-copy">B　科技节：广场、展台、导视为主</text>
    <text x="24" y="134" class="card-copy">C　两者各半</text>
    <text x="24" y="158" class="metric-label">影响：后续需要新增哪些美术素材</text>
  </g>

  <g transform="translate(1194 776)">
    <rect width="358" height="174" rx="20" fill="#222D24" stroke="#39483A" stroke-width="2"/>
    <circle cx="32" cy="33" r="16" fill="#A6533E"/><text x="27" y="39" class="chip">4</text>
    <text x="60" y="40" class="card-title">必须保留</text>
    <text x="24" y="76" class="card-copy">告诉我哪些不能动：</text>
    <text x="24" y="105" class="card-copy">湖 / 教学楼 / 凉亭 / 中央广场</text>
    <text x="24" y="134" class="card-copy">或是否要贴近真实校园平面</text>
    <text x="24" y="158" class="metric-label">这会决定草案 A 的下一轮形状</text>
  </g>

  <text x="48" y="989" class="metric-label">设计原则：不改变 96×72 尺寸与 40 个候选点数量；最终仍会做可达性、净空和碰撞测试。</text>
</svg>
