    <g fill="#172018" stroke="#F8F1DC" stroke-width="0.5">
      <circle cx="48" cy="27" r="2.3"/><circle cx="15" cy="25" r="2.3"/><circle cx="82" cy="31" r="2.3"/><circle cx="48" cy="58" r="2.3"/>
