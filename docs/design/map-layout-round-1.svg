    <rect x="48" y="128" width="716" height="540" rx="24" fill="#222D24" stroke="#39483A" stroke-width="2"/>
  </g>
  <text x="80" y="169" class="panel-title">现状｜十字主轴 + 放射支路</text>
  <text x="80" y="197" class="panel-copy">优点：方向直接　问题：中心过强、边角割裂、南区两块障碍形成长绕行</text>

