      .chip { font: 700 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1C241D; }
      .card-title { font: 700 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #F8F1DC; }
      .card-copy { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #C5CEB4; }
      .metric { font: 700 23px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #F0BD46; }
      .metric-label { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #AEB9A0; }
    </style>
  </defs>

  <rect width="1600" height="1020" fill="#172018"/>
  <circle cx="1435" cy="-70" r="300" fill="#527D45" opacity="0.10"/>
  <circle cx="115" cy="970" r="260" fill="#61A1A5" opacity="0.08"/>

  <text x="64" y="62" class="title">校园寻宝 · 地图布局讨论板 01</text>
  <text x="64" y="94" class="subtitle">先定空间骨架，再改 Godot。比例均为 96 × 72 格；黄点是宝箱候选点，蓝点是出生点。</text>
  <rect x="1327" y="43" width="209" height="42" rx="21" fill="#F0BD46"/>
  <text x="1360" y="70" class="chip">本轮：选择路线气质</text>

  <!-- Current layout panel -->
