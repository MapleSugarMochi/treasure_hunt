      <circle cx="89" cy="33" r="1.25"/><circle cx="4" cy="40" r="1.25"/><circle cx="15" cy="41" r="1.25"/><circle cx="26" cy="39" r="1.25"/>
      <circle cx="37" cy="42" r="1.25"/><circle cx="47" cy="44" r="1.25"/><circle cx="59" cy="41" r="1.25"/><circle cx="71" cy="40" r="1.25"/>
