      <circle cx="3" cy="3" r="1.25"/><circle cx="93" cy="3" r="1.25"/><circle cx="34" cy="68" r="1.25"/><circle cx="93" cy="68" r="1.25"/>
    </g>
    <circle cx="48" cy="36" r="2" fill="#315F82" stroke="#F8F1DC" stroke-width="0.6"/>
  </g>

  <rect x="83" y="611" width="617" height="37" rx="18" fill="#172018" opacity="0.9"/>
  <text x="102" y="635" class="panel-copy">观察：宝箱点覆盖均匀，但“路线体验”主要是从中心沿直线走到外围。</text>

  <!-- Proposed layout panel -->
  <g filter="url(#shadow)">
    <rect x="796" y="128" width="756" height="540" rx="24" fill="#222D24" stroke="#F0BD46" stroke-width="2"/>
  </g>
  <text x="828" y="169" class="panel-title">草案 A｜环形四区 + 中央活动场</text>
  <text x="828" y="197" class="panel-copy">目标：路线有选择但不迷路；每 8–12 秒遇到一个清晰地标；适合 2–3 分钟展会体验</text>

  <g transform="translate(870 216) scale(5.45)">
    <rect width="96" height="72" rx="2" fill="#8EB361" stroke="#A8C878" stroke-width="0.7"/>
    <rect width="96" height="72" fill="url(#grid)"/>
    <!-- proposed ring road -->
    <g fill="none" stroke="#D2AE6E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 22 C12 29 12 45 21 53 C33 64 65 64 79 53 C90 44 90 29 79 21 C66 13 34 13 20 22 Z"/>
      <path d="M48 15 L48 29 M48 43 L48 61"/>
      <path d="M16 36 L37 36 M59 36 L86 36"/>
    </g>
    <!-- central event plaza -->
    <rect x="37" y="28" width="22" height="16" rx="3" fill="#E8CF91" stroke="#3B302B" stroke-width="0.8"/>
    <path d="M42 33 H54 M42 39 H54" stroke="#D2AE6E" stroke-width="1" opacity="0.75"/>
    <!-- proposed landmarks -->
    <g stroke="#3B302B" stroke-width="0.8">
      <rect x="5" y="5" width="25" height="12" rx="1" fill="#E9D3A5"/>
      <rect x="6" y="6" width="23" height="3" fill="#A6533E" stroke="none"/>
      <rect x="66" y="5" width="25" height="12" rx="1" fill="#E9D3A5"/>
      <rect x="67" y="6" width="23" height="3" fill="#A6533E" stroke="none"/>
      <rect x="6" y="52" width="20" height="12" rx="1" fill="#E9D3A5"/>
      <rect x="7" y="53" width="18" height="3" fill="#A6533E" stroke="none"/>
      <rect x="72" y="52" width="19" height="12" rx="1" fill="#E9D3A5"/>
      <rect x="73" y="53" width="17" height="3" fill="#A6533E" stroke="none"/>
      <path d="M8 27 C12 22 24 23 28 29 C31 35 27 43 17 44 C7 43 4 34 8 27 Z" fill="#61A1A5"/>
      <path d="M9 31 C14 28 21 34 28 30 M9 38 C15 35 21 41 27 37" fill="none" stroke="#8BC7B6" stroke-width="0.8"/>
      <circle cx="78" cy="34" r="7" fill="#527D45"/>
      <circle cx="83" cy="39" r="5" fill="#6F914D"/>
    </g>
    <!-- balanced candidate zones -->
    <g fill="#F0BD46" stroke="#3B302B" stroke-width="0.45">
      <circle cx="3" cy="23" r="1.25"/><circle cx="11" cy="21" r="1.25"/><circle cx="22" cy="21" r="1.25"/><circle cx="33" cy="18" r="1.25"/>
      <circle cx="43" cy="20" r="1.25"/><circle cx="54" cy="20" r="1.25"/><circle cx="65" cy="19" r="1.25"/><circle cx="76" cy="21" r="1.25"/>
      <circle cx="90" cy="23" r="1.25"/><circle cx="4" cy="31" r="1.25"/><circle cx="31" cy="28" r="1.25"/><circle cx="64" cy="28" r="1.25"/>
      <circle cx="91" cy="31" r="1.25"/><circle cx="4" cy="40" r="1.25"/><circle cx="31" cy="42" r="1.25"/><circle cx="65" cy="42" r="1.25"/>
      <circle cx="92" cy="41" r="1.25"/><circle cx="6" cy="48" r="1.25"/><circle cx="18" cy="48" r="1.25"/><circle cx="30" cy="52" r="1.25"/>
      <circle cx="40" cy="52" r="1.25"/><circle cx="55" cy="52" r="1.25"/><circle cx="66" cy="49" r="1.25"/><circle cx="83" cy="47" r="1.25"/>
      <circle cx="92" cy="50" r="1.25"/><circle cx="29" cy="63" r="1.25"/><circle cx="39" cy="64" r="1.25"/><circle cx="50" cy="66" r="1.25"/>
      <circle cx="61" cy="64" r="1.25"/><circle cx="70" cy="62" r="1.25"/><circle cx="4" cy="68" r="1.25"/><circle cx="92" cy="68" r="1.25"/>
      <circle cx="4" cy="4" r="1.25"/><circle cx="35" cy="4" r="1.25"/><circle cx="48" cy="4" r="1.25"/><circle cx="61" cy="4" r="1.25"/>
      <circle cx="92" cy="4" r="1.25"/><circle cx="34" cy="68" r="1.25"/><circle cx="66" cy="68" r="1.25"/><circle cx="92" cy="57" r="1.25"/>
    </g>
    <circle cx="48" cy="36" r="2" fill="#315F82" stroke="#F8F1DC" stroke-width="0.6"/>
