      .subtitle { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #C5CEB4; }
      .panel-title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #F8F1DC; }
      .panel-copy { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #C5CEB4; }
      .map-label { font: 700 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #3B302B; text-anchor: middle; }
